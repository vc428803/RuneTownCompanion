# Local development server: accept connections from Android devices on the same LAN.
server.address=0.0.0.0
server.port=8080

# PostgreSQL credentials are supplied by the runtime environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/runetown_companion}
spring.datasource.username=${DB_USERNAME:runetown_app}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema changes; JPA must never create or update the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
